<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Relatórios</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0f12;--surface:#161a1f;--surface2:#1c2128;--surface3:#242b34;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
    --text:#e8ecf0;--text2:#8b94a0;--text3:#5a636e;
    --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
    --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.12);
    --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);
    --red:#ef4444;--red-dim:rgba(239,68,68,0.12);
    --purple:#a855f7;--purple-dim:rgba(168,85,247,0.12);
    --radius:10px;--radius-lg:16px;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .header-logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
  .header-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .header-right{display:flex;align-items:center;gap:16px}
  .header-updated{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}
  .header-nav-link{font-size:13px;color:var(--text2);text-decoration:none;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);transition:all 0.15s;background:none;cursor:pointer;font-family:'DM Sans',sans-serif}
  .header-nav-link:hover{background:var(--surface3);color:var(--text)}
  .header-nav-link.primary{background:var(--blue-dim);border-color:var(--blue);color:#93c5fd}

  .main{padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%;margin:0 auto}

  .squad-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .squad-tab{background:none;border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:8px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .squad-tab:hover{background:var(--surface3);color:var(--text)}
  .squad-tab.active{background:var(--blue-dim);border-color:var(--blue);color:#93c5fd}

  .filters-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px}
  .search-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.15s}
  .search-input:focus{border-color:var(--blue)}
  .search-input::placeholder{color:var(--text3)}
  #filtroCampanha{flex:1;min-width:200px}
  .select-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer}
  .select-input:focus{border-color:var(--blue)}
  .btn-refresh{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-refresh:hover{background:var(--surface3)}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px}
  .kpi-card.critico{border-color:rgba(239,68,68,0.4)}
  .kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .kpi-value{font-size:26px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)}
  .kpi-card.critico .kpi-value{color:var(--red)}
  .kpi-card.critico.tem-criticas{background:linear-gradient(135deg,rgba(239,68,68,0.28),rgba(239,68,68,0.08));border-color:var(--red);box-shadow:0 0 0 1px rgba(239,68,68,0.35),0 6px 24px rgba(239,68,68,0.2)}
  .kpi-card.critico.tem-criticas .kpi-label{color:#fca5a5}
  .kpi-card.critico.tem-criticas .kpi-value{color:#fecaca}

  .grid-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
  .grid-table-wrap{overflow-x:auto}
  .grid-table{width:100%;border-collapse:collapse;font-size:13px}
  .grid-table th{text-align:left;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:10px;padding:12px 16px;border-bottom:1px solid var(--border2);white-space:nowrap;background:var(--surface2);cursor:pointer;user-select:none;transition:color 0.15s}
  .grid-table th:hover{color:var(--text)}
  .grid-table th.num,.grid-table td.num{text-align:right}
  .sort-arrow{display:inline-block;margin-left:4px;font-size:9px;opacity:0.35}
  .sort-arrow.active{opacity:1;color:var(--blue)}
  .grid-table td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  .grid-table tr:last-child td{border-bottom:none}
  .grid-table tr:hover td{background:var(--surface2)}
  .grid-table tr.row-erro td{opacity:0.55}
  .grid-table tr.row-critico td{background:rgba(239,68,68,0.10)}
  .grid-table tr.row-critico td:first-child{box-shadow:inset 3px 0 0 0 var(--red)}
  .grid-table tr.row-critico:hover td{background:rgba(239,68,68,0.17)}
  .grid-table tr.row-atencao td{background:rgba(245,158,11,0.08)}
  .grid-table tr.row-atencao td:first-child{box-shadow:inset 3px 0 0 0 var(--amber)}
  .grid-table tr.row-atencao:hover td{background:rgba(245,158,11,0.14)}

  .cell-campanha{font-weight:500;color:var(--text)}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;margin-top:5px}
  .status-pill.critico{background:var(--red-dim);color:var(--red)}
  .status-pill.atencao{background:var(--amber-dim);color:var(--amber)}
  .status-pill.saudavel{background:var(--green-dim);color:var(--green)}
  .status-pill.erro{background:var(--purple-dim);color:var(--purple)}

  .cell-mono{font-family:'JetBrains Mono',monospace}

  .ativos-value{font-family:'JetBrains Mono',monospace;margin-bottom:5px}
  .ativos-bar-track{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden;width:90px}
  .ativos-bar-fill{height:100%;background:var(--blue);border-radius:99px}

  .prazo-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text2)}
  .prazo-chip.critico{color:var(--red);font-weight:600}
  .prazo-chip.atencao{color:var(--amber);font-weight:600}

  .report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .report-squad-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px}
  .report-squad-title{font-size:17px;font-weight:600;margin-bottom:16px}
  .report-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .report-stat-tile{border-radius:var(--radius);padding:18px 16px;text-align:center}
  .report-stat-value{font-size:34px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1.1}
  .report-stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-top:8px;color:var(--text2)}
  .report-stat-tile.critico{background:var(--red-dim);border:1px solid rgba(239,68,68,0.3)}
  .report-stat-tile.critico .report-stat-value{color:var(--red)}
  .report-stat-tile.critico.tem-valor{background:rgba(239,68,68,0.22);border-color:rgba(239,68,68,0.55)}
  .report-stat-tile.atencao{background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3)}
  .report-stat-tile.atencao .report-stat-value{color:var(--amber)}
  .report-stat-tile.saudavel{background:var(--green-dim);border:1px solid rgba(34,197,94,0.3)}
  .report-stat-tile.saudavel .report-stat-value{color:var(--green)}
  .report-stat-tile.neutro{background:var(--surface2);border:1px solid var(--border)}
  .report-stat-tile.neutro .report-stat-value{color:var(--text)}

  .grid-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px}
  .grid-footer-info{font-size:12px;color:var(--text3)}
  .pagination{display:flex;align-items:center;gap:6px}
  .page-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.15s}
  .page-btn:hover:not(:disabled){background:var(--surface3);color:var(--text)}
  .page-btn:disabled{opacity:0.35;cursor:default}
  .page-btn.active{background:var(--blue-dim);border-color:var(--blue);color:#93c5fd}

  .empty-state{padding:50px 20px;text-align:center;color:var(--text3);font-size:13px}

  .cell-editable{cursor:pointer;border-radius:6px;transition:background 0.1s}
  .cell-editable:hover{background:var(--surface3)}
  .edit-input{width:100%;background:var(--surface3);border:1px solid var(--blue);border-radius:6px;padding:4px 6px;color:var(--text);font-family:inherit;font-size:inherit;outline:none}

  .toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:999}
  .toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:10px;animation:toast-in 0.2s ease;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
  .toast.success{border-color:var(--green)}
  .toast.error{border-color:var(--red)}
  .toast.info{border-color:var(--blue)}
  @keyframes toast-in{from{transform:translateX(16px);opacity:0}}
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="header-logo-icon">📊</div>
    Painel Relatórios
  </div>
  <div class="header-right">
    <span class="header-updated" id="headerUpdated"></span>
    <button class="header-nav-link" onclick="carregarRelatorio()">Atualizar</button>
    <a class="header-nav-link" href="/adicionar-lista">Adicionar lista</a>
    <a class="header-nav-link primary" href="/executar">Rodar relatório →</a>
  </div>
</header>

<main class="main">
  <div class="squad-tabs" id="squadTabs">
    <button class="squad-tab active" data-squad="Onboarding" onclick="selecionarSquad('Onboarding')">Onboarding</button>
    <button class="squad-tab" data-squad="SDR REMOTO" onclick="selecionarSquad('SDR REMOTO')">SDR Remoto</button>
    <button class="squad-tab" data-squad="Geral" onclick="selecionarSquad('Geral')">Geral</button>
    <button class="squad-tab" data-squad="Report" onclick="selecionarSquad('Report')">Report</button>
  </div>

  <div id="squadView">
  <div class="filters-bar">
    <input class="search-input" id="filtroCampanha" placeholder="🔍  Buscar campanha ou conta..." oninput="onFiltroChange()"/>
    <select class="select-input" id="filtroStatus" onchange="onFiltroChange()">
      <option value="todos">Status: Todos</option>
      <option value="critico">Status: Crítico (&lt; 4 dias)</option>
      <option value="atencao">Status: Atenção (4–7 dias)</option>
      <option value="saudavel">Status: Saudável (7–10 dias)</option>
      <option value="nada">Status: Sem alerta (&gt; 10 dias)</option>
      <option value="erro">Status: Com erro</option>
    </select>
  </div>

  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-label">Total de disparos</div>
      <div class="kpi-value" id="kpiDisparos">—</div>
    </div>
    <div class="kpi-card critico" id="kpiCardCriticas">
      <div class="kpi-label">Contas críticas (&lt; 4 dias) ⚠️</div>
      <div class="kpi-value" id="kpiCriticas">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total de ativos restantes</div>
      <div class="kpi-value" id="kpiAtivos">—</div>
    </div>
  </div>

  <div class="grid-card">
    <div class="grid-table-wrap">
      <table class="grid-table">
        <thead>
          <tr>
            <th onclick="ordenarPor('campanha')">Campanha<span class="sort-arrow" id="arrow-campanha"></span></th>
            <th onclick="ordenarPor('contaEmail')">Conta<span class="sort-arrow" id="arrow-contaEmail"></span></th>
            <th onclick="ordenarPor('clienteConta')">Conta Snovio<span class="sort-arrow" id="arrow-clienteConta"></span></th>
            <th class="num" onclick="ordenarPor('disparos')">Disparos<span class="sort-arrow" id="arrow-disparos"></span></th>
            <th class="num" onclick="ordenarPor('ativosRestantes')">Ativos restantes<span class="sort-arrow" id="arrow-ativosRestantes"></span></th>
            <th class="num" onclick="ordenarPor('diasRestantes')">Prazo<span class="sort-arrow" id="arrow-diasRestantes"></span></th>
          </tr>
        </thead>
        <tbody id="gridBody">
          <tr><td colspan="6"><div class="empty-state">Carregando relatório...</div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="grid-footer">
      <div class="grid-footer-info" id="gridFooterInfo">—</div>
      <div style="display:flex;align-items:center;gap:14px">
        <select class="select-input" id="pageSize" onchange="onPageSizeChange()">
          <option value="10">10 por página</option>
          <option value="25" selected>25 por página</option>
          <option value="50">50 por página</option>
        </select>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
  </div>

  <div id="reportView" style="display:none">
    <div class="report-grid" id="reportGrid"></div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="script.js"></script>
</body>
</html>
