version: "3.9"

services:
  painel-relatorios:
    build: .
    container_name: painel-relatorios
    restart: unless-stopped
    ports:
      - "6767:3000"
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - CREDENTIALS_API_URL=http://snov-am-api:8000
      - CREDENTIALS_API_KEY=${CREDENTIALS_API_KEY}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ativaai

networks:
  ativaai:
    external: true