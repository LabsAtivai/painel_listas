version: "3.9"

services:
  painel-relatorios:
    build: .
    container_name: painel-relatorios
    restart: unless-stopped
    ports:
      - "6767:3000"
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s